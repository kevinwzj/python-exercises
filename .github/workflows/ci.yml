name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; else pip install black flake8 mypy pytest pytest-cov; fi
      - name: Format check
        run: black --check .
      - name: Lint
        run: flake8 .
      - name: Type-check
        run: mypy .
      - name: Tests with coverage
        run: python -m pytest --cov=exercises --cov-report=term --cov-report=xml -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
