name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.8, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        shell: pwsh
        run: |
          if (Test-Path 'dev-requirements.txt') {
            pip install -r dev-requirements.txt
          } else {
            pip install black flake8 mypy pytest pytest-cov
          }
      - name: Format check
        shell: pwsh
        run: black --check .
      - name: Lint
        shell: pwsh
        run: flake8 .
      - name: Type-check
        shell: pwsh
        run: mypy .
      - name: Tests with coverage
        shell: pwsh
        run: python -m pytest --cov=exercises --cov-report=term --cov-report=xml --cov-report=html -q
      - name: Upload coverage artifact (xml)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload coverage artifact (html)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

